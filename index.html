<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Factor's Ledger</title>
<meta name="description" content="Daily petty cash (daraz raqam) tracker for a factor." />
<meta name="theme-color" content="#153A30" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --cream: #FAF6EC;
    --bottle: #1F4B3F;
    --bottle-dark: #153A30;
    --brass: #A9762F;
    --brass-dark: #7A5620;
    --brick: #A34A3A;
    --brick-dark: #7C3628;
    --rule: #DCD2B8;
    --ink: #2B241B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  #app-root {
    padding: 20px 16px 64px;
  }
  .ledger-container { max-width: 780px; margin: 0 auto; }

  .ledger-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 14px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 18px; margin-bottom: 22px;
  }
  .ledger-kicker {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: 0.04em; color: var(--brass-dark); margin: 0 0 4px 0;
  }
  .ledger-h1 { font-size: 30px; font-weight: 700; color: var(--bottle-dark); margin: 0; line-height: 1.1; }
  .ledger-tabs { display: flex; border: 1px solid var(--bottle-dark); border-radius: 8px; overflow: hidden; height: fit-content; }
  .ledger-tab {
    background: transparent; border: none; font-family: 'Source Serif 4', serif; font-size: 15px;
    padding: 8px 16px; cursor: pointer; color: var(--bottle-dark);
  }
  .ledger-tab.active { background: var(--bottle-dark); color: var(--cream); }
  .ledger-tab:not(:last-child) { border-right: 1px solid var(--bottle-dark); }

  .card { background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 18px; }

  .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .date-row label { font-size: 14px; color: var(--bottle-dark); }
  .date-input {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; border: 1px solid var(--rule);
    border-radius: 8px; padding: 8px 10px; background: #fff; color: var(--ink);
  }
  .date-caption { font-size: 13px; color: #6b6252; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 14px; }
  .tile-label { font-size: 12.5px; color: #6b6252; margin: 0 0 6px 0; }
  .tile-value { font-size: 19px; font-weight: 600; margin: 0; }
  .tile-value.brass { color: var(--brass-dark); }
  .tile-value.brick { color: var(--brick-dark); }
  .tile-value.bottle { color: var(--bottle-dark); }

  .forms-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 620px) { .forms-row { grid-template-columns: 1fr; } }
  .form-title { font-size: 16px; font-weight: 600; color: var(--bottle-dark); margin: 0 0 12px 0; }
  .form-field { margin-bottom: 10px; }
  .form-field label { display: block; font-size: 12.5px; color: #6b6252; margin-bottom: 4px; }
  .form-field input {
    width: 100%; font-family: 'Source Serif 4', serif; font-size: 15px; padding: 8px 10px;
    border: 1px solid var(--rule); border-radius: 7px; background: var(--cream); color: var(--ink);
  }
  .form-field input.mono-input { font-family: 'IBM Plex Mono', monospace; }

  .btn {
    font-family: 'Source Serif 4', serif; font-size: 15px; padding: 9px 18px; border-radius: 7px;
    border: 1px solid var(--bottle-dark); background: var(--bottle-dark); color: var(--cream); cursor: pointer;
  }
  .btn:hover { background: var(--bottle); }
  .btn-expense { border-color: var(--brick-dark); background: var(--brick-dark); }
  .btn-expense:hover { background: var(--brick); }
  .btn-amad { border-color: var(--brass-dark); background: var(--brass-dark); }
  .btn-amad:hover { background: var(--brass); }

  .entries-card { margin-bottom: 20px; }
  .entries-title, .eod-title { font-size: 16px; font-weight: 600; color: var(--bottle-dark); margin: 0 0 12px 0; }
  .entry-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .entry-row:last-child { border-bottom: none; }
  .entry-time { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6b6252; width: 52px; flex-shrink: 0; }
  .entry-main { flex: 1; min-width: 0; }
  .entry-category { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .entry-note { font-size: 13px; color: #857b68; }
  .entry-amount { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; flex-shrink: 0; }
  .entry-amount.in { color: var(--brass-dark); }
  .entry-amount.out { color: var(--brick-dark); }
  .entry-delete {
    background: none; border: none; color: #a89c85; font-size: 17px; cursor: pointer;
    line-height: 1; padding: 4px 2px; flex-shrink: 0;
  }
  .entry-delete:hover { color: var(--brick-dark); }
  .empty-note { font-size: 14px; color: #857b68; font-style: italic; }

  .eod-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
  .eod-row .label { color: #6b6252; }
  .eod-row .value { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .eod-divider { border: none; border-top: 1px solid var(--rule); margin: 6px 0; }

  .banner { margin-top: 14px; padding: 14px 16px; border-radius: 8px; font-size: 15px; border: 1px solid; }
  .banner.balanced { background: #EEF3EC; border-color: var(--bottle-dark); color: var(--bottle-dark); }
  .banner.excess { background: #FBF1E1; border-color: var(--brass-dark); color: var(--brass-dark); }
  .banner.shortage { background: #F7E9E5; border-color: var(--brick-dark); color: var(--brick-dark); }

  .reopen-link {
    display: inline-block; margin-top: 10px; font-size: 13.5px; color: var(--bottle-dark);
    text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0;
    font-family: 'Source Serif 4', serif;
  }

  .start-day-card { max-width: 380px; }

  .history-row { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .history-row:last-child { border-bottom: none; }
  .history-row:hover { background: rgba(31,75,63,0.04); }
  .history-date { font-size: 14.5px; font-weight: 600; width: 130px; flex-shrink: 0; }
  .history-meta { font-size: 13px; color: #6b6252; flex: 1; }
  .history-opening { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: #6b6252; width: 100px; text-align: right; flex-shrink: 0; }
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 4px 9px; border-radius: 6px; flex-shrink: 0; }
  .tag-grey { background: #ECE7DA; color: #6b6252; }
  .tag-balanced { background: #E1EBE3; color: var(--bottle-dark); }
  .tag-excess { background: #FBF1E1; color: var(--brass-dark); }
  .tag-shortage { background: #F7E9E5; color: var(--brick-dark); }

  @media (max-width: 600px) {
    .history-meta { display: none; }
  }

  .header-actions { display:flex; align-items:flex-end; justify-content:flex-end; gap:7px; flex-wrap:wrap; }
  .backup-nudge { font-size:11px; color:#857b68; margin-top:7px; }
  .btn-small { font-size:12.5px; padding:7px 10px; }
  .btn-light { background:transparent; color:var(--bottle-dark); border-color:var(--rule); }
  .btn-light:hover { background:#fff; }
  .entry-edit { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--rule); }
  .entry-edit-fields { flex:1; display:grid; grid-template-columns:90px 1fr 1fr; gap:6px; }
  .entry-edit-fields input { width:100%; min-width:0; padding:7px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--cream); font-family:'Source Serif 4',serif; }
  .entry-edit-fields input.mono-input { font-family:'IBM Plex Mono',monospace; }
  .entry-edit-btn, .history-delete {
    background:none; border:1px solid var(--rule); color:var(--bottle-dark); border-radius:6px;
    font-family:'Source Serif 4',serif; font-size:12px; padding:4px 7px; cursor:pointer; flex-shrink:0;
  }
  .entry-edit-btn:hover { background:#f5f0e5; }
  .history-row { cursor:default; padding-right:0; }
  .history-open { flex:1; min-width:0; display:flex; align-items:center; gap:12px; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:inherit; font:inherit; }
  .history-delete { font-size:17px; border:none; color:#a89c85; }
  .history-delete:hover { color:var(--brick-dark); }
  .eod-buttons { display:flex; gap:8px; flex-wrap:wrap; }
  .undo-toast {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:20;
    display:flex; align-items:center; gap:14px; background:var(--bottle-dark); color:var(--cream);
    border-radius:8px; padding:10px 13px; box-shadow:0 6px 22px rgba(0,0,0,.18); font-size:14px;
  }
  .undo-toast button { border:1px solid rgba(255,255,255,.55); background:transparent; color:var(--cream); border-radius:5px; padding:4px 9px; cursor:pointer; }
  @media (max-width:620px) {
    .header-actions { width:100%; justify-content:flex-start; align-items:center; }
    .entry-edit-fields { grid-template-columns:1fr; }
    .history-date { width:auto; }
    .history-opening { width:auto; margin-left:auto; }
    .tag { display:none; }
  }
</style>
</head>
<body>
<div id="app-root"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
